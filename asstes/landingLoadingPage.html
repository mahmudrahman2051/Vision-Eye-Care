<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Eye Care Logo Reveal (Champagne Gold)</title>
<style>
  :root {
    --bg: #14161a;
    --accent: #E7B84A;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: min(84vw, 1100px, calc(80vh * 1.3955));
    aspect-ratio: 1482 / 1062;
    cursor: pointer;
  }

  .stage svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* tiny luminous drawing point */
  #drawing-point {
    --dot: clamp(4px, .45vw, 6px);
    position: absolute; left: 0; top: 0;
    width: var(--dot); height: var(--dot);
    margin: calc(var(--dot) / -2) 0 0 calc(var(--dot) / -2);
    border-radius: 50%;
    background: #FFF0B3;
    box-shadow: 0 0 6px 1px rgba(246,215,122,.9), 0 0 18px 5px rgba(231,184,74,.30);
    opacity: 0;
    will-change: transform, opacity;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="stage" id="stage" title="Click to replay">

    <svg id="vision-logo" viewBox="0 0 1482 1062" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vision Eye Care logo">
      <defs>

64.68,405.60C156.83,402.70 153.58,397.52 154.20,388.92C154.70,381.98 156.75,378.74 168.95,365.61C205.07,326.74 255.26,295.38 310.00,277.48C325.12,272.53 335.57,271.78 341.47,275.22C351.70,281.18 353.76,293.51 346.00,302.34C342.42,306.42 338.94,307.93 322.83,312.39C272.94,326.22 223.30,356.72 191.04,393.39C180.41,405.46 173.28,408.76 164.68,405.60Z M1292.25,405.34C1288.92,404.16 1286.05,401.59 1279.02,393.52C1243.62,352.85 1195.36,323.36 1144.00,311.00C1130.03,307.64 1126.31,305.49 1122.89,298.79C1119.51,292.16 1120.67,284.12 1125.81,278.63C1133.36,270.55 1145.30,271.17 1173.50,281.08C1229.19,300.65 1273.04,330.62 1308.75,373.52C1319.04,385.89 1317.77,399.06 1305.71,404.90C1300.68,407.33 1298.12,407.42 1292.25,405.34Z"/>

        <!-- reveal masks: animation layer only, the artwork is never modified -->
        <mask id="mask-a" maskUnits="userSpaceOnUse" x="0" y="0" width="1482" height="1062"></mask>
        <mask id="mask-b" maskUnits="userSpaceOnUse" x="0" y="0" width="1482" height="1062"></mask>

        <linearGradient id="champagneGold" gradientUnits="userSpaceOnUse" x1="130" y1="130" x2="1350" y2="930">
          <stop offset="0%"   stop-color="#FFF0B3"/>
          <stop offset="35%"  stop-color="#E7B84A"/>
          <stop offset="65%"  stop-color="#C88A1A"/>
          <stop offset="100%" stop-color="#F6D77A"/>
        </linearGradient>

        <radialGradient id="head-glow" gradientUnits="userSpaceOnUse" cx="1283" cy="590" r="150">
          <stop offset="0"   stop-color="#F6D77A" stop-opacity=".95"/>
          <stop offset=".45" stop-color="#F6D77A" stop-opacity=".35"/>
          <stop offset="1"   stop-color="#F6D77A" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="sweep-grad" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="-100" y2="300">
          <stop offset="0"  stop-color="#FFF0B3" stop-opacity="0"/>
          <stop offset=".5" stop-color="#FFF0B3" stop-opacity=".8"/>
          <stop offset="1"  stop-color="#FFF0B3" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- invisible tracing geometry (drives the masks and the drawing point) -->
      <g id="trace-geo" fill="none" stroke="none"></g>

      <!-- 1. pale champagne leading edge -->
      <use id="layer-a" href="#logo-path" fill="#FFF0B3" mask="url(#mask-a)"/>
      <!-- 2. settled champagne-gold gradient, trailing just behind the head -->
      <use id="layer-b" href="#logo-path" fill="url(#champagneGold)" mask="url(#mask-b)"/>
      <!-- 3. soft optical glow around the active area -->
      <use id="glow-layer" href="#logo-path" fill="url(#head-glow)" mask="url(#mask-a)" opacity="0"/>
      <!-- 4. finishing light sweep -->
      <!-- 5. final state: one clean, unmasked copy of the original path (crisp edges, no seams) -->
      <use id="final-layer" href="#logo-path" fill="url(#champagneGold)" visibility="hidden"/>
      <use id="sweep-layer" href="#logo-path" fill="url(#sweep-grad)" opacity="0"/>
    </svg>

    <div id="drawing-point"></div>
  </div>

<script>
(function () {
  "use strict";

  var NS = "http://www.w3.org/2000/svg";
  var stage = document.getElementById("stage");
  var dot = document.getElementById("drawing-point");
  var maskA = document.getElementById("mask-a");
  var maskB = document.getElementById("mask-b");
  var geo = document.getElementById("trace-geo");
  var glowGrad = document.getElementById("head-glow");
  var glowUse = document.getElementById("glow-layer");
  var sweepGrad = document.getElementById("sweep-grad");
  var sweepUse = document.getElementById("sweep-layer");
  var layerA = document.getElementById("layer-a");
  var layerB = document.getElementById("layer-b");
  var finalUse = document.getElementById("final-layer");
  var reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");

  /* timing (ms): reveal ~1.6s, settle ~0.4s */
  var T_APPEAR = 120, T_DRAW = 1500, T_FINISH = 380;
  var LAG = 140;            /* pale-gold -> champagne-gold trail length (path units) */
  var MOVE_WEIGHT = 0.15;    /* blank travel between strokes is quicker */

  /* geometry read from the supplied SVG:
     right ring centre (1053,590) with its rightmost node at (1308.98, 590.21) = start point;
     left ring centre (412,590); outer corner arcs at r~315 */
  var C1 = { x: 1053, y: 590 }, C2 = { x: 412, y: 590 };
  var RAD = Math.PI / 180;

  function arcPts(c, r0, r1, a0, a1) {
    var n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 1.5)), out = [];
    for (var i = 0; i <= n; i++) {
      var u = i / n, a = (a0 + (a1 - a0) * u) * RAD, r = r0 + (r1 - r0) * u;
      out.push([c.x + r * Math.cos(a), c.y + r * Math.sin(a)]);
    }
    return out;
  }
  function toD(p) { return "M" + p.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("L"); }

  var items = [
    { draw: true,  w: 124, pts: arcPts(C1, 230, 230, 0, 360) },     /* 1 outer right ring, from the right */
    { draw: false,         pts: arcPts(C1, 230, 212, 360, 595) },   /*   beam sweeps inward to the bridge */
    { draw: true,  w: 100, pts: [[850, 452], [630, 462]] },         /* 2 bridge */
    { draw: true,  w: 124, pts: arcPts(C2, 230, 230, 330, -30) },   /* 3 left ring + inner marks */
    { draw: true,  w: 70,  pts: arcPts(C2, 315, 315, 213, 265) },   /* 4 outer details */
    { draw: true,  w: 70,  pts: arcPts(C1, 315, 315, 280, 328) }
  ];

  var segs = [], total = 0, scale = 1;

  function build() {
    var list = [];
    items.forEach(function (it, i) {
      if (i > 0) {
        var prev = list[list.length - 1].pts, a = prev[prev.length - 1], b = it.pts[0];
        if (Math.hypot(a[0] - b[0], a[1] - b[1]) > 1.5) list.push({ draw: false, pts: [a, b] });
      }
      list.push(it);
    });
    var acc = 0;
    list.forEach(function (it) {
      var d = toD(it.pts);
      var g = document.createElementNS(NS, "path");
      g.setAttribute("d", d); geo.appendChild(g);
      var len = g.getTotalLength();
      var seg = { draw: it.draw, len: len, cost: len * (it.draw ? 1 : MOVE_WEIGHT), start: acc, geo: g };
      if (it.draw) {
        ["a", "b"].forEach(function (k) {
          var p = document.createElementNS(NS, "path");
          p.setAttribute("d", d);
          p.setAttribute("fill", "none");
          p.setAttribute("stroke", "#fff");
          p.setAttribute("stroke-width", it.w);
          p.setAttribute("stroke-linejoin", "round");
          p.setAttribute("stroke-dasharray", len + " " + len);
          p.setAttribute("stroke-dashoffset", len);
          (k === "a" ? maskA : maskB).appendChild(p);
          seg[k] = p;
        });
      }
      segs.push(seg);
      acc += seg.cost;
    });
    total = acc;
  }

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function easeIO(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  /* slow start, faster middle, slow finish */
  function ease(t) { return .3 * easeIO(t) + .7 * t; }

  function resize() { scale = stage.clientWidth / 1482; }
  window.addEventListener("resize", resize);

  var head = { x: 1283, y: 590 };

  function render(d, lag) {
    var found = false;
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (s.draw) {
        s.a.setAttribute("stroke-dashoffset", s.len * (1 - clamp01((d - s.start) / s.cost)));
        s.b.setAttribute("stroke-dashoffset", s.len * (1 - clamp01((d - lag - s.start) / s.cost)));
      }
      if (!found && (d <= s.start + s.cost || i === segs.length - 1)) {
        var p = clamp01((d - s.start) / s.cost), pt = s.geo.getPointAtLength(p * s.len);
        head.x = pt.x; head.y = pt.y; found = true;
      }
    }
    glowGrad.setAttribute("cx", head.x); glowGrad.setAttribute("cy", head.y);
  }

  function placeDot(opacity, k) {
    dot.style.opacity = opacity;
    dot.style.transform = "translate3d(" + (head.x * scale) + "px," + (head.y * scale) + "px,0) scale(" + k + ")";
  }

  function setSweep(sp) {
    if (sp <= 0 || sp >= 1) { sweepUse.setAttribute("opacity", 0); return; }
    var x = -400 + sp * (1482 + 800);
    sweepGrad.setAttribute("x1", x); sweepGrad.setAttribute("x2", x + 300);
    sweepUse.setAttribute("opacity", 1);
  }

  function setFinal(on) {
    finalUse.setAttribute("visibility", on ? "visible" : "hidden");
    layerA.setAttribute("visibility", on ? "hidden" : "visible");
    layerB.setAttribute("visibility", on ? "hidden" : "visible");
  }

  function showComplete() {
    setFinal(true);
    render(total + 1, 0);
    glowUse.setAttribute("opacity", 0);
    setSweep(0);
    dot.style.opacity = 0;
  }

  var raf = 0, t0 = 0;

  function frame(now) {
    var e = now - t0;
    if (e < T_APPEAR) {
      render(0, LAG);
      glowUse.setAttribute("opacity", 0);
      placeDot(clamp01(e / T_APPEAR), 1);
    } else if (e < T_APPEAR + T_DRAW) {
      render(ease((e - T_APPEAR) / T_DRAW) * total, LAG);
      glowUse.setAttribute("opacity", 1);
      placeDot(1, 1);
    } else if (e < T_APPEAR + T_DRAW + T_FINISH) {
      var f = e - T_APPEAR - T_DRAW;
      render(total, LAG * (1 - easeIO(clamp01(f / 350))));
      var k = f < 200 ? 1 + 0.9 * easeIO(f / 200) : 1.9 - 0.9 * clamp01((f - 200) / 220);
      placeDot(f < 200 ? 1 : 1 - clamp01((f - 200) / 220), k);
      glowUse.setAttribute("opacity", 1 - clamp01(f / 400));
      setSweep(f / T_FINISH);
    } else {
      showComplete();           /* clean, stable final logo */
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  function start() {
    cancelAnimationFrame(raf);
    setFinal(false);
    resize();
    if (reduceMq.matches) { showComplete(); return; }   /* reduced motion: finished logo, no dot */
    render(0, LAG);
    placeDot(0, 1);
    raf = requestAnimationFrame(function (now) { t0 = now; frame(now); });
  }

  build();
  stage.addEventListener("click", start);
  if (document.readyState === "complete") start();
  else window.addEventListener("load", start, { once: true });
})();
</script>
